    <div class="text-box">
        <h1>陈曦然<img src="../cxr/images/cxr.png"></h1>
        <h2>个人介绍</h2>
        <hr>
        <p>一名普通大学生，最大的爱好是宅家，偶尔会做些手工、烘焙陶冶情操，但对所有事物都是三分钟热度。而且非常懒惰，常年窝在自己的舒适区，接受被动的输入，不喜输出。</p>
        <p>学业方面，有一定的自主学习能力，但需要一个开始的契机，而且方法成谜。时常在做仰卧起坐，卷不起来，躺不平，但运动一下也很满足。很容易满足，也很难得到进步。</p>
        <p>平日游戏并非主要的娱乐活动，因此游戏经验有限，但也非常想要参与一场游戏制作之旅，故参与了此项目，将以真诚的态度像小组成员学习，为项目贡献自己的力量。</p>
