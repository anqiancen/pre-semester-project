<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>地图 1 · 小镇春天</title>
<style>
  @font-face { font-family: 'FZG_CN'; src: url('fonts/FZG_CN.ttf') format('truetype'); }
</style>
</head>
<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh">
<canvas id="g"></canvas>
<script src="dialogue.js"></script>
<script>
// ==================== 1. 常量 ====================
const T = 32;             // 游戏里每个格子
const TILE = 16;          // 贴图集里每块贴图
const S = 24;             // 玩家碰撞盒边长
const SPEED = 150;        // 移动速度：每秒走多少像素
const ANIM = 0.15;        // 走路动画：每帧停留多少秒
const FONT = "'FZG_CN', monospace";

//相机
const VIEW_W = 1080;      //视口宽
const VIEW_H = 720;       //视口高
const HEADROOM = 12;      //顶部留白
const MARGIN = 2;         //左/右/下留白

//音乐
const bgm = new Audio("audio/spring_town_BGM.mp3");   // 本图 BGM（秋天小镇）
bgm.loop = true;                                // 循环播放
bgm.volume = 0.6;                               // 音量 0~1

bgm.play().catch(() => {});
document.addEventListener("keydown", () => bgm.play().catch(() => {}), { once: true });

//地面层
const MAP = [
  "##################################################D#################################################",
  "#..................................................................................................#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#..................................................................................................#",
  "2222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222",
  "5555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555",
  "8888888888888888888888888888888888888888888888888559888888888888888888888888888888888888888888888888",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "################################################4556################################################",
];

// 地面层贴图表
const TILES = {
  '.': { sheet: "outdoors", col: 1,  row: 9 },  // 草地
  '#': { sheet: "outdoors", col: 1,  row: 9, solid: true },  // 边界（暂时也是草地，坐标待确认）
  '~': { sheet: "outdoors", col: 8,  row: 13, solid: true },  // 水面
  'D': { sheet: "outdoors", col: 11, row: 18 },  // 门/出入口
  '2': { sheet: "outdoors", col: 6,  row: 18 },
  '5': { sheet: "outdoors", col: 6,  row: 19 },
  '8': { sheet: "outdoors", col: 6,  row: 20 },
  '4': { sheet: "outdoors", col: 5,  row: 19 },
  '6': { sheet: "outdoors", col: 7,  row: 19 },
  '9': { sheet: "outdoors", col: 11, row: 22 },
};

//物品层
const OBJ_TYPES = {
  tree: {                       // 树：上树冠能走、下树根挡路，锚点在树根
    sheet: "outdoors", sx: 160, sy: 256,
    sw: TILE, sh: TILE * 2, ax: 0, ay: 1,
    mask: [".", "#"],
  },
  flower: {                     // 花
    sheet: "outdoors", sx: 112, sy: 160,
    sw: TILE, sh: TILE, ax: 0, ay: 0,
    mask: ["#"],
  },
  border: {                     // 边界草
    sheet: "outdoors", sx: 304, sy: 144,
    sw: TILE, sh: TILE * 2, ax: 0, ay: 1,
    mask: ["#"],
  },
  barrel: {                     // 桶
    sheet: "outdoors", sx: 320, sy: 944,
    sw: TILE * 2, sh: TILE * 2, ax: 0, ay: 1,
    mask: ["##", "##"],
  },
  water_barrel: {               // 宽水桶
    sheet: "outdoors", sx: 288, sy: 128,
    sw: TILE * 2, sh: TILE, ax: 0, ay: 0,
    mask: ["##"],
  },
  house: {                      // 大房子：12×10，锚点在脚下（ay=10），向上伸 10 格
    sheet: "town", sx: 192, sy: 640,
    sw: TILE * 12, sh: TILE * 10, ax: 0, ay: 10,
    mask: [
      "############", "############", "############", "############", "############",
      "############", "############", "############", "############", "############",
    ],
  },
  barn: {                       // 谷仓：7×8，锚点在左上角
    sheet: "barn", sx: 0, sy: 0,
    sw: TILE * 7, sh: TILE * 8, ax: 0, ay: 0,
    mask: [
      ".......", ".......", ".......", "#######",
      "#######", "#######", "#######", "#######",
    ],
  },
};

//小物品
const OBJ_MAP = [
  "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
  "...........................................................................b.w.w.w.w.w.w............",
  "..T.........T............T................T............T..............T....b............b...T...T...",
  "...........................................................................b............b...........",
  "...........................................................................b............b.T.........",
  "..............................................T......T.....................b............b...........",
  "...........................................................................b............b...........",
  ".........F..............................F..................................bbbbbbbbbbbbbb.T.........",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "..............................................T......T..............F...............................",
  ".........F..............................F...........................................................",
  "..T.........T............T................T............T..............T.....................T...T...",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
];
const OBJ_CHAR = { T: "tree", F: "flower", B: "border", b: "barrel", w: "water_barrel" };

//大物品
const FREE_OBJECTS = [
  { type: "house", col: 6,  row: 9 },
  { type: "house", col: 44, row: 9 },
  { type: "house", col: 60, row: 3 },
  { type: "barn",  col: 60, row: 11 },
];

//贴图URL
const SHEETS = {
  outdoors: "img/spring_outdoorsTileSheet.png",
  town:     "img/spring_town.png",
  barn:     "img/Deluxe Barn.png",
  alex:     "img/Alex.png",
  npc:      "img/Bouncer.png",           
};

//INIT
const img = {};
const names = Object.keys(SHEETS);
let loaded = 0;

const g = document.getElementById("g");
g.width = VIEW_W;
g.height = VIEW_H;
const c = g.getContext("2d");
c.imageSmoothingEnabled = false;

//物品遮挡
function makeObj(type, col, row) {
  return Object.assign({ col, row }, OBJ_TYPES[type]);
}

function buildObjects() {
  const objs = [];
  for (let y = 0; y < OBJ_MAP.length; y++)
    for (let x = 0; x < OBJ_MAP[y].length; x++) {
      const type = OBJ_CHAR[OBJ_MAP[y][x]];
      if (type) objs.push(makeObj(type, x, y));
    }
  for (const o of FREE_OBJECTS)
    objs.push(makeObj(o.type, o.col, o.row));
  return objs;
}

const OBJECTS = buildObjects();

//玩家设定
let px = 49 * T + 4, py = 9 * T + 4;   // 出生点：横竖主路交汇处（世界坐标）
let dir = 0;                           // 朝向：0=下 1=右 2=上 3=左

// 从别的图传送过来时玩家位置
const spawnQ = new URLSearchParams(location.search);
if (spawnQ.get("x")) {
  px = parseFloat(spawnQ.get("x"));
  py = parseFloat(spawnQ.get("y"));
  dir = parseInt(spawnQ.get("dir") || "0", 10);
}
let frame = 0;//玩家的四帧
let animTime = 0;

//可交互列表
const ENTITIES = [
  {
    kind: "npc",
    x: 49 * T, y: 11 * T,    
    sheet: "npc",       
    solid: true,   
    dialogue: "spring_mayor",
  },
  {        //传送点             
    kind: "warp",
    x: 99 * T, y: 9 * T,     
    solid: true,              
    prompt: "前往冬天",        
    to: "map2.html",         
    spawn: { x: 2 * T + 4, y: 9 * T + 4, dir: 1 },//新图出生点
  },
];

let state = "play"; 
let cur = null; 
let page = 0;    
let choiceIdx = 0;     

//相机
let camX = 0, camY = 0;            

function updateCamera() {
  camX = px + S / 2 - VIEW_W / 2;    
  camY = py + S / 2 - VIEW_H / 2;
  camX = Math.max(-MARGIN * T, Math.min(camX, MAP[0].length * T - VIEW_W + MARGIN * T));
  camY = Math.max(-HEADROOM * T, Math.min(camY, MAP.length * T - VIEW_H + MARGIN * T));
}

//渲染地图
function draw() {
  updateCamera();

  c.fillStyle = "#000";                  
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  c.save();
  c.translate(-camX, -camY);        

  //地面层
  for (let y = 0; y < MAP.length; y++)
    for (let x = 0; x < MAP[y].length; x++) {
      const t = TILES[MAP[y][x]];
      if (t) c.drawImage(img[t.sheet],
                         t.col * TILE, t.row * TILE, TILE, TILE,   // 源
                         x * T, y * T, T, T);                       // 目标（世界坐标）
    }

  drawActors();                            //实体层
  if (state === "play") drawPrompts();     
  c.restore();

  if (state === "talk") drawDialogue(); 
}

function drawPlayer() {
  const SCALE = T / TILE;
  const pw = TILE * SCALE;            
  const ph = TILE * 2 * SCALE;          
  const sx = frame * TILE;
  const sy = dir * TILE * 2;
  const dx = px + S / 2 - pw / 2;         
  const dy = py + S - ph;                
  c.drawImage(img.alex, sx, sy, TILE, TILE * 2, dx, dy, pw, ph);
}

function drawObject(o) {
  const SCALE = T / TILE;
  const dx = (o.col - o.ax) * T;          
  const dy = (o.row - o.ay) * T;
  c.drawImage(img[o.sheet], o.sx, o.sy, o.sw, o.sh, dx, dy, o.sw * SCALE, o.sh * SCALE);
}

function drawEntity(e) {                  
  if (!e.sheet) return;           
  const SCALE = T / TILE;
  const w = TILE * SCALE, h = TILE * 2 * SCALE;
  c.drawImage(img[e.sheet], 0, 0, TILE, TILE * 2, e.x + S / 2 - w / 2, e.y + S - h, w, h);
}

function drawPrompt(e) {                 
  const SCALE = T / TILE;
  const headTop = e.y + S - TILE * 2 * SCALE;   
  const tx = e.x + S / 2, ty = headTop - 8;     
  const label = e.prompt ? "▶ [Z] " + e.prompt : "▼ [Z]";

  c.font = "bold 13px " + FONT;
  c.textAlign = "center";
  c.textBaseline = "middle";
  const w = Math.max(44, c.measureText(label).width + 12); 
  c.fillStyle = "rgba(0,0,0,0.7)";              
  c.fillRect(tx - w / 2, ty - 8, w, 16);
  c.fillStyle = "#ffe14d";                       
  c.fillText(label, tx, ty + 1);
  c.textAlign = "left";                          
  c.textBaseline = "alphabetic";
}

function drawPrompts() {                 
  const e = entityInFront();
  if (e) drawPrompt(e);
}

function drawActors() {//对所有实体进行排序，然后画出
  const actors = [];
  for (const o of OBJECTS)
    actors.push({ footY: (o.row - o.ay) * T + o.sh * (T / TILE), kind: "obj", obj: o });
  for (const e of ENTITIES)
    actors.push({ footY: e.y + S, kind: "ent", ent: e });
  actors.push({ footY: py + S, kind: "player" });

  actors.sort((a, b) => a.footY - b.footY);   

  for (const a of actors) {
    if (a.kind === "player") drawPlayer();
    else if (a.kind === "ent") drawEntity(a.ent);
    else drawObject(a.obj);
  }
}

//碰撞
function solidInObject(gx, gy) {             
  for (const o of OBJECTS) {
    const fx = gx - (o.col - o.ax);     
    const fy = gy - (o.row - o.ay);
    if (o.mask[fy] && o.mask[fy][fx] === '#') return true;
  }
  return false;
}

function solidInEntity(x, y) {              
  for (const e of ENTITIES) {
    if (!e.solid) continue;
    if (x >= e.x && x < e.x + S && y >= e.y && y < e.y + S) return true;
  }
  return false;
}

function solidAt(x, y) {                     
  const gx = Math.floor(x / T);
  const gy = Math.floor(y / T);
  if (!MAP[gy] || !MAP[gy][gx]) return true; // 地图外
  const t = TILES[MAP[gy][gx]];              
  if (t && t.solid) return true;             // 地面层
  if (solidInObject(gx, gy)) return true;    // 静态Object
  if (solidInEntity(x, y)) return true;      // 动态Object
  return false;
}

function hitsWall(x, y) {                   
  return solidAt(x, y) || solidAt(x + S, y) ||
         solidAt(x, y + S) || solidAt(x + S, y + S);
}

//对话
function startDialogue(e) {
  cur = DIALOGUE[e.dialogue];
  page = 0;
  choiceIdx = 0;
  state = "talk";
}

function entityInFront() {                   
  const cx = Math.floor((px + S / 2) / T);
  const cy = Math.floor((py + S / 2) / T);
  const fx = cx + (dir === 1) - (dir === 3); 
  const fy = cy + (dir === 0) - (dir === 2);
  for (const e of ENTITIES) {
    const ex = Math.floor((e.x + S / 2) / T);
    const ey = Math.floor((e.y + S / 2) / T);
    if (ex === fx && ey === fy && (e.dialogue || e.to)) return e;
  }
  return null;
}

function interact() {                        // 按 Z：和"面前那一格"的实体互动
  const e = entityInFront();
  if (!e) return;
  if (e.to) {                                // 传送点：跳转到目标地图的出生点
    const s = e.spawn || { x: 0, y: 0, dir: 0 };
    location.href = e.to + "?x=" + Math.round(s.x) + "&y=" + Math.round(s.y) + "&dir=" + (s.dir || 0);
  } else if (e.dialogue) {                   // 对话 NPC
    startDialogue(e);
  }
}

function talkUpdate() {                      // 对话中：处理翻页 / 选项
  const p = cur[page];
  if (p.choices) {
    const n = p.choices.length;
    if (pressed("ArrowUp")   || pressed("KeyW")) choiceIdx = (choiceIdx - 1 + n) % n;
    if (pressed("ArrowDown") || pressed("KeyS")) choiceIdx = (choiceIdx + 1) % n;
    if (pressed("KeyZ") || pressed("Enter")) {   // 确认选择
      const next = p.choices[choiceIdx].next;
      if (next) { cur = DIALOGUE[next]; page = 0; choiceIdx = 0; }
      else state = "play";
    }
    if (pressed("KeyX") || pressed("ShiftLeft")) state = "play";  // 取消
  } else {
    if (pressed("KeyZ") || pressed("Enter")) {   // 翻下一页
      page++;
      if (page >= cur.length) state = "play";    // 翻完 = 结束对话
    }
  }
}

function drawDialogue() {                    // 屏幕坐标：底部对话框
  const p = cur[page];
  const bx = 16, by = VIEW_H - 120, bw = VIEW_W - 32, bh = 104;
  c.fillStyle = "rgba(0,0,0,0.85)";
  c.fillRect(bx, by, bw, bh);
  c.strokeStyle = "#fff";
  c.strokeRect(bx, by, bw, bh);
  c.fillStyle = "#fff";
  c.font = "16px " + FONT;

  if (p.choices) {
    c.fillText(p.text, bx + 16, by + 26);
    for (let i = 0; i < p.choices.length; i++)
      c.fillText((i === choiceIdx ? "▶ " : "    ") + p.choices[i].label, bx + 16, by + 56 + i * 24);
  } else {
    c.fillText(p.text, bx + 16, by + 34);
    c.fillText("▼ Z", bx + bw - 48, by + bh - 18);
  }
}

// 输入流
const keys = {};        // 按住状态（移动用）
const just = {};        // 这一帧"刚按下"（交互/对话用）
document.addEventListener("keydown", e => {
  keys[e.code] = true;
  just[e.code] = true;
  if (e.code.startsWith("Arrow")) e.preventDefault();
});
document.addEventListener("keyup", e => keys[e.code] = false);

function pressed(code) { return just[code]; } 

//Loop
let last = 0;
function update(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;

  if (state === "talk") {//对话不可移动
    talkUpdate();
    draw();
    for (const k in just) just[k] = false;
    requestAnimationFrame(update);
    return;
  }

  let vx = 0, vy = 0;
  if (keys["ArrowLeft"]  || keys["KeyA"]) vx = -1;
  if (keys["ArrowRight"] || keys["KeyD"]) vx = 1;
  if (keys["ArrowUp"]    || keys["KeyW"]) vy = -1;
  if (keys["ArrowDown"]  || keys["KeyS"]) vy = 1;
  if (vx && vy) { vx *= 0.707; vy *= 0.707; }

  const moving = vx !== 0 || vy !== 0;
  if (moving) {
    if (vx > 0) dir = 1;
    else if (vx < 0) dir = 3;
    else if (vy > 0) dir = 0;
    else if (vy < 0) dir = 2;
    animTime += dt;
    frame = Math.floor(animTime / ANIM) % 4;
  } else {
    animTime = 0;
    frame = 0;
  }

  px += vx * SPEED * dt;
  if (hitsWall(px, py)) px -= vx * SPEED * dt;
  py += vy * SPEED * dt;
  if (hitsWall(px, py)) py -= vy * SPEED * dt;

  const cx = Math.floor((px + S / 2) / T);   // 玩家中心所在格
  const cy = Math.floor((py + S / 2) / T);
  if (MAP[cy] && MAP[cy][cx] === 'D') location.href = "map2.html"; // 踩到门 → 跳转

  if (pressed("KeyZ") || pressed("Enter")) interact();   // 按 Z 互动

  draw();
  for (const k in just) just[k] = false;                 // 清空"刚按下"标记
  requestAnimationFrame(update);
}

//开始游戏
function start() {
  draw();
  requestAnimationFrame(update);
}

for (const name of names) {
  img[name] = new Image();
  img[name].onload = () => {
    loaded++;
    if (loaded === names.length) start();
  };
  img[name].src = SHEETS[name];
}
</script>
</body>
</html>
