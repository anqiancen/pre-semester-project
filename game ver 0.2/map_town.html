<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>地图编辑器 · 小镇</title>
</head>
<body style="margin:0;background:#111;color:#bbb;font:14px/1.7 monospace;padding:24px">
<div style="margin-bottom:16px">
  <b style="color:#fff">地图编辑器 · 小镇（100 宽 × 20 高）</b><br>
  只改下面「地图数据区」，保存后刷新浏览器（Cmd/Ctrl + R）看效果。<br>
  做满意后，把「地图数据区」整块（<span style="color:#ffd75f">从 <code>const MAP</code> 到 <code>const SHEETS</code></span>）复制回游戏文件。<br>
  <span style="color:#ff9a9a">⚠ 水面 <code>~</code>、石板路 <code>=</code>、花盆、房子、谷仓的坐标还是占位，用 tiles_viewer.html 确认后填进下面的 TODO 处。</span>
</div>
<canvas id="g"></canvas>
<script>
// ==================== 1. 常量 ====================
const T = 32;             // 游戏里每个格子 32 像素
const TILE = 16;          // 贴图集里每块贴图 16 像素

// ╔══════════════════════════════════════════════════════════════════╗
// ║   ★★★★★ 地图数据区 ★★★★★   （做地图只改这里，改完整块复制回游戏）  ║
// ╚══════════════════════════════════════════════════════════════════╝

// ---------- 第 1 层：地面（土地样式） ----------
// '#' = 悬崖/边界(挡路)   '.' = 草地   '~' = 水面   '=' = 石板路   'D' = 出入口
// 小镇布局：一圈悬崖做边界；横竖两条主路在中心交汇；右上角一个小池塘；四边各一个出入口。
const MAP = [
  "##################################################D#################################################",
  "#..................................................................................................#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#...........................................................................~~~~~~~~~~~~~..........#",
  "#..................................................................................................#",
  "2222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222222",
  "5555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555555",
  "8888888888888888888888888888888888888888888888888559888888888888888888888888888888888888888888888888",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "#...............................................4556...............................................#",
  "################################################4556################################################",
];

// 地面层贴图表：地图字符 → { 在哪张图, 第几列, 第几行, solid:是否挡路 }（不写 solid = 能走）
// ★ 草地 / 悬崖 / 门 三个坐标已在 winter 版验证过；spring/fall/winter 三张季节图同布局，可直接搬。
const TILES = {
  '.': { sheet: "outdoors", col: 1,  row: 9 },  //草地
  '#': { sheet: "outdoors", col: 1, row: 9, solid: true },  //暂时也是草地
  '~': { sheet: "outdoors", col: 8,  row: 13, solid: true },  //水面
  //路
  '2': { sheet: "outdoors",     col: 6,  row: 18  },
  '5': { sheet: "outdoors",     col: 6,  row: 19  },
  '8': { sheet: "outdoors",     col: 6,  row: 20  },
  '4': { sheet: "outdoors",     col: 5,  row: 19  },
  '6': { sheet: "outdoors",     col: 7,  row: 19  },
  '9': { sheet: "outdoors",     col: 11,  row: 22  },
};

// ---------- 物品"类型"注册表 ----------
// 每种物品登记一次：长相(哪张图+源位置+源大小) + 锚点 + 碰撞足迹。
// ★ 锚点（ax/ay）：表示"你写 col/row 的那一格落在脚印第几列/第几行"。
//   贴图左上角 = (col - ax, row - ay)。树锚点在树根(ay=1)，房子/谷仓锚点在左上角。
const OBJ_TYPES = {
  // 树
  tree: {
    sheet: "outdoors",
    sx: 160, sy: 256,
    sw: TILE, sh: TILE * 2,
    ax: 0, ay: 1,
    mask: [".", "#"],
  },

  // 花
  flower: {
    sheet: "outdoors",
    sx: 112, sy: 160,
    sw: TILE, sh: TILE,
    ax: 0, ay: 0,
    mask: ["#"],
  },
  border:{//边界草
    sheet:"outdoors",
    sx: 304, sy: 144,                
    sw: TILE, sh: TILE*2,
    ax: 0, ay: 1,
    mask: ["#"],
  },
  barrel:{//桶
    sheet:"outdoors",
    sx: 320, sy: 944,                
    sw: TILE*2, sh: TILE*2,
    ax: 0, ay: 1,
    mask: ["##","##"],
  },
  water_barrel:{//宽水桶
    sheet:"outdoors",
    sx: 288, sy: 128,                
    sw: TILE*2, sh: TILE,
    ax: 0, ay: 0,
    mask: ["##"],
  },
  // 房子：4 列 × 3 行。锚点 = 左上角。
  house: {//大房子
    sheet: "town",              
    sx: 192, sy: 640,                 
    sw: TILE * 12, sh: TILE * 10,
    ax: 0, ay: 10,
    mask: [                       // 全部实心（占位）
      "############",
      "############",
      "############",
      "############",
      "############",
      "############",
      "############",
      "############",
      "############",
      "############",
    ],
  },
  // 谷仓
  barn: {
    sheet: "barn",
    sx: 0, sy: 0,
    sw: TILE * 7, sh: TILE * 8,
    ax: 0, ay: 0,
    mask: [
      ".......",
      ".......",
      "#######",
      "#######",
      "#######",
      "#######",
      "#######",
      "#######",
    ],
  },
};

// ---------- 第 2 层：网格物体（字符画，逐格对齐地面） ----------
const OBJ_MAP = [
  "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB",
  "...........................................................................b.w.w.w.w.w.w............",
  "..T.........T............T................T............T..............T....b............b...T...T...",
  "...........................................................................b............b...........",
  "...........................................................................b............b.T.........",
  "..............................................T......T.....................b............b...........",
  "...........................................................................b............b...........",
  ".........F..............................F..................................bbbbbbbbbbbbbb.T.........",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
  "..............................................T......T..............F...............................",
  ".........F..............................F...........................................................",
  "..T.........T............T................T............T..............T.....................T...T...",
  "....................................................................................................",
  "....................................................................................................",
  "....................................................................................................",
];

// 物体字符 → 类型名（要和 OBJ_TYPES 里的键对上）
const OBJ_CHAR = { T: "tree", F: "flower", B: "border" ,b:"barrel",w:"water_barrel"};

// ---------- 第 3 层：自由物体清单（精确坐标，放大物件） ----------
// 房子/谷仓这类大物件放这里。每项：{ type: 类型名, col: 列, row: 行 }（锚点格）
const FREE_OBJECTS = [
  { type: "house", col: 6,  row: 9 },
  { type: "house", col: 44, row: 9 },
  { type: "house", col: 60, row: 3 },
  { type: "barn",  col: 60, row: 11 },
];

// ---------- 贴图集（这张地图要用到的图） ----------
// 注意：玩家图 alex 由游戏引擎单独加载，这里不用列；
// 若在这里加了新图，记得在游戏文件里也同步加一行。
const SHEETS = {
  outdoors: "img/spring_outdoorsTileSheet.png",
  town:     "img/spring_town.png",              // 石板路（=）占位用
  houses:   "img/houses.png",                   // 房子贴图集
  barn:     "img/Deluxe Barn.png",              // 谷仓（单张精灵图）
};

// ╔══════════════════════════════════════════════════════════════════╗
// ║   ★★★★★ 预览引擎 ★★★★★   （下面代码不用复制，游戏里已有对应逻辑）  ║
// ╚══════════════════════════════════════════════════════════════════╝

// 画布自动适配地图大小；顶部额外预留 HEADROOM 格，给"高出地图顶部"的高建筑（房子）留渲染空间
const HEADROOM = 12;        // 顶部留白格数（≥ 最高建筑格高；房子 10 格，留 12 保险）
const OFFY = HEADROOM * T;  // 所有绘制向下平移的像素量（把地图顶部往下挪，腾出上方空间）
const g = document.getElementById("g");
g.width  = MAP[0].length * T;
g.height = (MAP.length + HEADROOM) * T;
const c = g.getContext("2d");
c.imageSmoothingEnabled = false;          // 关闭平滑：像素风更清晰

// 合并第 2、3 层，生成统一的 OBJECTS 数组
function makeObj(type, col, row) {
  return Object.assign({ col, row }, OBJ_TYPES[type]);
}

function buildObjects() {
  const objs = [];
  // 第 2 层：扫字符画，见字符就按"字符所在格"生成物体
  for (let y = 0; y < OBJ_MAP.length; y++)
    for (let x = 0; x < OBJ_MAP[y].length; x++) {
      const type = OBJ_CHAR[OBJ_MAP[y][x]];
      if (type) objs.push(makeObj(type, x, y));
    }
  // 第 3 层：直接按清单的精确坐标生成
  for (const o of FREE_OBJECTS)
    objs.push(makeObj(o.type, o.col, o.row));
  return objs;
}

const OBJECTS = buildObjects();

// ---------- 画图 ----------
function draw() {
  for (let y = 0; y < MAP.length; y++)
    for (let x = 0; x < MAP[y].length; x++) {
      const t = TILES[MAP[y][x]];
      if (t) c.drawImage(img[t.sheet],
                         t.col * TILE, t.row * TILE, TILE, TILE,   // 源
                         x * T, OFFY + y * T, T, T);                // 目标（整体下移 OFFY）
    }
  drawActors();       // 再画物体层（按脚底 y 排序，解决前后遮挡）
}

function drawObject(o) {
  const SCALE = T / TILE;
  const dx = (o.col - o.ax) * T;           // 贴图左上角 = 锚点格 - 锚点偏移
  const dy = OFFY + (o.row - o.ay) * T;    // 同样下移 OFFY，让"高出顶部"的部分有地方画
  c.drawImage(img[o.sheet], o.sx, o.sy, o.sw, o.sh, dx, dy, o.sw * SCALE, o.sh * SCALE);
}

function drawActors() {
  const actors = [];
  for (const o of OBJECTS)
    actors.push({ footY: (o.row - o.ay) * T + o.sh * (T / TILE), obj: o });
  actors.sort((a, b) => a.footY - b.footY);  // 脚底越小越靠上，先画（被后面的盖住）
  for (const a of actors) drawObject(a.obj);
}

// ---------- 加载贴图，加载完画一帧 ----------
const img = {};
const names = Object.keys(SHEETS);
let loaded = 0;
for (const name of names) {
  img[name] = new Image();
  img[name].onload = () => { if (++loaded === names.length) draw(); };
  img[name].src = SHEETS[name];
}
</script>
</body>
</html>
